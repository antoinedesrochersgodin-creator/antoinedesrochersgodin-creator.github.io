<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rivière Rivière</title>

<style>
body {
  margin: 0;
  font-family: Helvetica, sans-serif;
  min-height: 100vh;

  /* Fond bleu vignette */
  background: radial-gradient(circle at center,
    #cfe9ff 0%,
    #6ea8dc 45%,
    #1f4f91 100%
  );
}

/* Logo */
.logo {
  display: block;
  margin: 60px auto 60px auto;
  width: 420px;
}

/* Grille régulière */
.gallery {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 32px;
  padding: 0 60px 80px;
  max-width: 1400px;
  margin: 0 auto;
}

/* Cadre image */
.item {
  width: 100%;
  aspect-ratio: 4 / 3; /* format uniforme */
  overflow: hidden;
  background: #000;
}

/* Image ou GIF */
.item img {
  width: 100%;
  height: 100%;
  object-fit: cover; /* CROPPING PROPRE */
  display: block;
}
</style>
</head>

<body>

<img class="logo" src="images/RRLOGO.png" alt="Rivière Rivière">

<div class="gallery">

  <div class="item"><img src="images/extrait1.gif" alt=""></div>

  <div class="item"><img src="images/Z63_7171.jpg" alt=""></div>
  <div class="item"><img src="images/Z63_7097.jpg" alt=""></div>
  <div class="item"><img src="images/Z63_7082.jpg" alt=""></div>
  <div class="item"><img src="images/Z63_7051.jpg" alt=""></div>
  <div class="item"><img src="images/Z63_6971.jpg" alt=""></div>
  <div class="item"><img src="images/Z63_6946.jpg" alt=""></div>
  <div class="item"><img src="images/Z63_6894.jpg" alt=""></div>
  <div class="item"><img src="images/Z63_6892.jpg" alt=""></div>
  <div class="item"><img src="images/Z63_6788.jpg" alt=""></div>
  <div class="item"><img src="images/Z63_6761.jpg" alt=""></div>

</div>

</body>
</html>
